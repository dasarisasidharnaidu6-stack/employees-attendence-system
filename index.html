<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Employee Attendance</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'DM Sans', sans-serif; }
    .mono { font-family: 'DM Mono', monospace; }
    .card-shadow { box-shadow: 6px 6px 0px #1a1a2e; }
    .btn-shadow { box-shadow: 3px 3px 0px #1a1a2e; }
    .btn-shadow:active { box-shadow: none; transform: translate(3px, 3px); }
  </style>
</head>
<body class="min-h-screen bg-[#f0ede8] flex items-center justify-center p-4">

  <div class="w-full max-w-md">

    <!-- Header -->
    <div class="mb-8 flex items-center justify-center">

      <div class="flex items-center gap-4">

        <img
          src="assets/logo.png"
          alt="Company Logo"
          class="w-24 h-24 object-contain"
        />

        <div>
          <div class="inline-block bg-[#1a1a2e] text-[#f0ede8] px-4 py-1 mono text-xs font-medium tracking-widest uppercase mb-2">
            Attendance System
          </div>

          <h1 class="text-3xl font-semibold text-[#1a1a2e] tracking-tight">
            Employee Portal
          </h1>
        </div>

      </div>

    </div>

    <!-- Card -->
    <div class="bg-white border-2 border-[#1a1a2e] card-shadow rounded-sm p-8">

      <!-- Login section -->
      <div id="login-section">
        <h2 class="text-sm font-semibold text-[#1a1a2e] mono uppercase tracking-widest mb-5">Sign In</h2>
        <div class="space-y-4">
          <div>
            <label class="block text-xs font-medium text-gray-500 uppercase tracking-wider mb-1">Email</label>
            <input
              id="email"
              type="email"
              placeholder="you@company.com"
              class="w-full border-2 border-[#1a1a2e] rounded-sm px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#4a90d9] bg-[#f9f9f7]"
            />
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-500 uppercase tracking-wider mb-1">Password</label>
            <input
              id="password"
              type="password"
              placeholder="••••••••"
              class="w-full border-2 border-[#1a1a2e] rounded-sm px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#4a90d9] bg-[#f9f9f7]"
            />
          </div>
          <button
            id="loginBtn"
            class="w-full bg-[#1a1a2e] text-[#f0ede8] py-2.5 px-4 text-sm font-semibold uppercase tracking-wider rounded-sm btn-shadow transition-all duration-100 hover:bg-[#2e2e4a]"
          >
          <!-- Employee Name Dropdown -->
          <div>
            <label class="block text-xs font-medium text-gray-500 uppercase tracking-wider mb-1">
              Employee Name
            </label>

            <select
              id="employeeName"
              class="w-full border-2 border-[#1a1a2e] rounded-sm px-3 py-2 text-sm text-black focus:outline-none focus:ring-2 focus:ring-[#4a90d9] bg-[#f9f9f7]"
            >
              <option value="">Select Employee</option>
            </select>
          </div>

          <!-- Team Dropdown -->
          <div>
            <label class="block text-xs font-medium text-gray-500 uppercase tracking-wider mb-1">
              Team Name
            </label>

            <select
              id="teamName"
              class="w-full border-2 border-[#1a1a2e] rounded-sm px-3 py-2 text-sm text-black focus:outline-none focus:ring-2 focus:ring-[#4a90d9] bg-[#f9f9f7]"
            >
              <option value="">Select Team</option>
            </select>
          </div>

          <!-- Work Mode -->
          <div>
            <label class="block text-xs font-medium text-gray-500 uppercase tracking-wider mb-2">
              Work Mode
            </label>

            <div class="flex gap-6 mt-2">

              <label class="flex items-center gap-2 text-sm text-gray-200">
                <input
                  type="radio"
                  name="workMode"
                  value="Offline"
                  checked
                />
                Offline
              </label>

              <label class="flex items-center gap-2 text-sm text-gray-200">
                <input
                  type="radio"
                  name="workMode"
                  value="Remote"
                />
                Remote
              </label>

            </div>
          </div>
            Login →
          </button>
        </div>
      </div>

      <!-- Divider -->
      <div class="my-6 border-t-2 border-dashed border-gray-200"></div>

      <!-- Work Description -->
      <div class="mb-5">
        <label class="block text-sm font-semibold text-[#1a1a2e] mono uppercase tracking-widest mb-3">
          Last 1 Hour Work Description
        </label>

        <textarea
          id="description"
          rows="4"
          placeholder="Describe what you completed in the last 1 hour..."
          class="w-full border-2 border-[#1a1a2e] rounded-sm p-3 text-sm text-[#1a1a2e] bg-white focus:outline-none"
        ></textarea>
      </div>

      <!-- Session Counter -->
      <div class="mb-5">
        <p
          id="sessionCounter"
          class="text-sm font-semibold text-[#1a1a2e] mono uppercase tracking-wide"
        >
          Session: 0 / 6
        </p>
      </div>

      <!-- Attendance Actions -->
      <div>
        <h2 class="text-sm font-semibold text-[#1a1a2e] mono uppercase tracking-widest mb-5">
          Mark Attendance
        </h2>

        <div class="grid grid-cols-2 gap-3">
          <button
            id="checkInBtn"
            class="bg-[#2ecc71] border-2 border-[#1a1a2e] text-[#1a1a2e] py-3 px-4 text-sm font-bold uppercase tracking-wider rounded-sm btn-shadow transition-all duration-100 hover:bg-[#27ae60]"
          >
            ✓ Check In
          </button>

          <button
            id="checkOutBtn"
            class="bg-[#e74c3c] border-2 border-[#1a1a2e] text-white py-3 px-4 text-sm font-bold uppercase tracking-wider rounded-sm btn-shadow transition-all duration-100 hover:bg-[#c0392b]"
          >
            ✗ Check Out
          </button>
        </div>
      </div>  
      

      <!-- Status message -->
      <div id="status" class="mt-5 hidden">
        <div id="status-inner" class="border-2 rounded-sm px-4 py-3 text-sm mono"></div>
      </div>

    </div>

    <!-- Admin link -->
    <p class="text-center text-xs text-gray-400 mt-5 mono">
      Admin? <a href="admin.html" class="text-[#1a1a2e] underline font-medium">Go to Admin Panel →</a>
    </p>

  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
